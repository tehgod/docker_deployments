services:
  vpn-public:
    image: binhex/arch-qbittorrentvpn
    container_name: qbittorrent-public
    networks:
      - home_theater_network
    cap_add:
      - NET_ADMIN
    ports:
      - "8118:8118"
      - "9118:9118"
      - "10022:10022"
    environment:
      - VPN_ENABLED=yes
      - VPN_USER=${OPENVPN_USERNAME}
      - VPN_PASS=${OPENVPN_PASSWORD}
      - VPN_PROV=pia
      - VPN_CLIENT=openvpn
      - ENABLE_STARTUP_SCRIPTS=yes
      - ENABLE_PRIVOXY=yes
      - STRICT_PORT_FORWARD=yes
      - USERSPACE_WIREGUARD=no
      - ENABLE_SOCKS=no
      - LAN_NETWORK=${HOME_NETWORK}  # Updated LAN network
      - NAME_SERVERS=8.8.8.8,8.8.4.4
      - DEBUG=false
      - WEBUI_PORT=10022
      - UMASK=002
      - PUID=${HOME_THEATER_UID}  # Updated PUID
      - PGID=${HOME_THEATER_GID}  # Updated PGID
      - TZ=${TZ}
    volumes:
      - ${HOME_THEATER_DIR}/torrents/public:/data-public
      - ${APPDATA_DIR}/qbittorrent-public:/config
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  prowlarr-public:
    image: linuxserver/prowlarr
    container_name: prowlarr-public
    restart: unless-stopped
    networks:
      - home_theater_network
    ports:
      - 10024:9696
    environment:
      - PUID=${HOME_THEATER_UID}
      - PGID=${HOME_THEATER_GID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/prowlarr-public:/config
    depends_on:
      - vpn
    labels:
      - "com.centurylinklabs.watchtower.enabldoce=true"

  radarr-public:
    image: linuxserver/radarr
    container_name: radarr-public
    restart: unless-stopped
    networks:
      - home_theater_network
    environment:
      - PUID=${HOME_THEATER_UID}
      - PGID=${HOME_THEATER_GID}
      - TZ=${TZ}
    ports:
      - 10001:7878
    volumes:
      - ${APPDATA_DIR}/radarr:/config
      - ${HOME_THEATER_DIR}:/data
    depends_on:
      - prowlarr
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  sonarr-public:
    image: linuxserver/sonarr
    restart: unless-stopped
    container_name: sonarr-public
    networks:
      - home_theater_network
    environment:
      - PUID=${HOME_THEATER_UID}
      - PGID=${HOME_THEATER_GID}
      - TZ=${TZ}
    ports:
      - 10002:8989
    volumes:
      - ${APPDATA_DIR}/sonarr:/config
      - ${HOME_THEATER_DIR}:/data
    depends_on:
      - prowlarr
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  bazarr:
    image: linuxserver/bazarr
    restart: unless-stopped
    container_name: bazarr
    networks:
      - home_theater_network
    environment:
      - PUID=${HOME_THEATER_UID}
      - PGID=${HOME_THEATER_GID}
      - TZ=${TZ}
    ports:
      - 10018:6767
    volumes:
      - ${APPDATA_DIR}/bazarr:/config
      - ${HOME_THEATER_DIR}:/data
    depends_on:
      - prowlarr
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
  
  seerr:
    image: ghcr.io/seerr-team/seerr
    container_name: seerr
    init: true
    networks:
      - home_theater_network
      - traefik_proxy
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055
    ports:
      - 10006:5055
    volumes:
      - ${APPDATA_DIR}/overseerr:/app/config
    restart: unless-stopped
    user: "${HOME_THEATER_UID}:${HOME_THEATER_GID}"
    depends_on:
      - radarr
      - sonarr
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.overseerr-rtr.entrypoints=websecure"
      - "traefik.http.routers.overseerr-rtr.rule=Host(`request.$DOMAINNAME_1`)"
      # HTTP Services
      - "traefik.http.routers.overseerr-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.overseerr-rtr.service=overseerr-svc"
      - "traefik.http.services.overseerr-svc.loadbalancer.server.port=5055"
      - "com.centurylinklabs.watchtower.enable=true"

  kavita:
    image: jvmilazz0/kavita
    container_name: kavita
    networks:
      - traefik_proxy
    environment:
      - TZ=${TZ}
    volumes:
      - ${HOME_THEATER_DIR}:/data
      - ${APPDATA_DIR}/kavita:/kavita/config
    ports:
      - 10017:5000
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.kavita-rtr.entrypoints=websecure"
      - "traefik.http.routers.kavita-rtr.rule=Host(`kavita.$DOMAINNAME_1`)"
      # HTTP Services
      - "traefik.http.routers.kavita-rtr.middlewares=chain-authelia@file"
      - "traefik.http.routers.kavita-rtr.service=kavita-svc"
      - "traefik.http.services.kavita-svc.loadbalancer.server.port=5000"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  home_theater_network:
    driver: bridge
    name: home_theater_network
  traefik_proxy:
    driver: bridge
    name: traefik_proxy
